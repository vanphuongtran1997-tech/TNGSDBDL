    <script>
      // Ensure window.fetch has both a getter and a setter so that third-party scripts,
      // sandbox environments, and monitoring wrappers can safely reassign or patch window.fetch
      // without triggering "Cannot set property fetch of #<Window> which has only a getter".
      (function() {
        try {
          var origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          var customFetch = origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch;
            },
            set: function(fn) {
              customFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window) || (window.constructor && window.constructor.prototype);
            if (proto) {
              var origProtoFetch = proto.fetch ? proto.fetch.bind(window) : null;
              var customProtoFetch = origProtoFetch;
              Object.defineProperty(proto, 'fetch', {
                get: function() {
                  return customProtoFetch;
                },
                set: function(fn) {
                  customProtoFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e2) {}
        }
      })();
    </script>
